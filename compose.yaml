name: solo70-frescobench
services:
  bench:
    build:
      context: .
      args:
        FRESCOBENCH_DEPS_IMAGE: ${FRESCOBENCH_DEPS_IMAGE:-python:3.11-slim}
    image: ${FRESCOBENCH_IMAGE:-solo70-frescobench:1.0}
    network_mode: bridge
    environment:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      WAITRESS_THREADS: 4
    ports:
      - "127.0.0.1:${FRESCOBENCH_PORT:-19989}:8000"
    volumes:
      - surface-library:/var/lib/frescobench
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/api/health', timeout=3).status==200"]
      interval: 4s
      timeout: 4s
      retries: 12
volumes:
  surface-library:
